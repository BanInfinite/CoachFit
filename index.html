<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Coach Fit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0f172a;--bg2:#1e293b;--tx:#e2e8f0;--mu:#94a3b8;--in:#6366f1;--em:#10b981;--gl:rgba(30,41,59,.55);--bd:rgba(148,163,184,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#312e81 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#064e3b 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:24px;margin:6px 0 14px}h2{font-size:17px;margin:20px 0 8px}h3{margin:0 0 6px;font-size:16px}
.card{background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
.m{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;color:var(--mu);font-size:12px;margin:8px 0 3px}
input,select,textarea{width:100%;background:rgba(15,23,42,.7);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px;font:inherit}
.btn{border:0;border-radius:14px;padding:13px 16px;font:600 15px inherit;color:#fff;background:var(--bg2);cursor:pointer;width:100%;margin:6px 0}
.btn.p{background:linear-gradient(135deg,#6366f1,#4f46e5)}.btn.e{background:linear-gradient(135deg,#10b981,#059669)}.btn.d{background:#7f1d1d}.btn.s{width:auto;padding:8px 12px;font-size:13px;margin:0}
.chip{display:inline-block;padding:8px 12px;border-radius:99px;border:1px solid var(--bd);margin:3px;cursor:pointer;background:rgba(15,23,42,.5)}.chip.on{background:var(--in);border-color:var(--in)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,23,42,.92);backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);font:12px inherit;padding:6px;cursor:pointer}nav button b{display:block;font-size:20px}nav button.on{color:var(--em)}
.big{font-size:34px;font-weight:800;text-align:center}.stp{display:flex;gap:8px;align-items:center}.stp input{text-align:center;font-size:24px;font-weight:700}.stp button{width:52px;height:52px;border-radius:14px;border:0;background:var(--bg2);color:var(--tx);font-size:22px;flex:none}
.tip{border-left:3px solid var(--em);background:rgba(16,185,129,.1);padding:10px 12px;border-radius:10px;font-size:14px}
#rest{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
#rest svg{max-width:80vw}.pr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
img.th{width:100%;max-height:180px;object-fit:contain;border-radius:12px;margin-top:8px}
.w{overflow-x:auto}canvas{max-width:100%}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--em);color:#fff;padding:10px 16px;border-radius:99px;z-index:20;display:none}
</style></head><body>
<div id="app"></div><div id="rest"></div><div id="toast"></div>
<nav id="nav"><button data-t="hoy"><b>🏋️</b>Hoy (Gym)</button><button data-t="rut"><b>📋</b>Rutinas</button><button data-t="pro"><b>📈</b>Progreso</button><button data-t="perf"><b>👤</b>Perfil</button></nav>
<script>
const KEY='coachfit_v1',$=s=>document.querySelector(s);
let S={profile:{sex:'m',act:3,goal:'gain'},lib:[],routines:[],history:[],weights:[]};
try{const d=localStorage.getItem(KEY);if(d)S=Object.assign(S,JSON.parse(d))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const e1=(w,r)=>r<=0?0:r==1?w:w*(1+r/30);
const r1=n=>Math.round(n*10)/10;
let tab='hoy',W=null,date=today(),free=null,R=null,chart=null,cmode='1rm',cex='',AC,sel={};
const GOALS={gain:'Hipertrofia / Ganancia Muscular',keep:'Mantenimiento',cut:'Pérdida de Grasa / Definición'};
const ACTS=['','Sedentario','Ligera (1-3 d/sem)','Moderada (3-5 d/sem)','Alta (6-7 d/sem)','Muy alta (2 sesiones/día)'];
const FACT=[0,1.2,1.375,1.55,1.725,1.9];
const CAT=Object.fromEntries([['Press banca plano','Pecho','6-10'],['Press inclinado mancuernas','Pecho','8-12'],['Press militar','Hombro','6-10'],['Elevaciones laterales','Hombro','12-20'],['Extensión de tríceps en polea','Tríceps','10-15'],['Press francés','Tríceps','8-12'],['Dominadas','Espalda','6-10'],['Remo con barra','Espalda','6-10'],['Jalón al pecho','Espalda','8-12'],['Remo en polea','Espalda','8-12'],['Curl de bíceps','Bíceps','8-12'],['Face pull','Hombro posterior','12-20'],['Sentadilla','Cuádriceps','6-10'],['Peso muerto rumano','Isquios','8-12'],['Prensa de piernas','Cuádriceps','10-15'],['Curl femoral','Isquios','10-15'],['Elevación de gemelos','Gemelos','10-20'],['Hip thrust','Glúteo','8-12']].map(a=>[a[0],[a[1],a[2]]]));
const TPL=[['Push (PPL)',[['Press banca plano',4],['Press inclinado mancuernas',3],['Press militar',3],['Elevaciones laterales',4],['Extensión de tríceps en polea',3]]],['Pull (PPL)',[['Dominadas',4],['Remo con barra',3],['Remo en polea',3],['Face pull',3],['Curl de bíceps',3]]],['Legs (PPL)',[['Sentadilla',4],['Peso muerto rumano',3],['Prensa de piernas',3],['Curl femoral',3],['Elevación de gemelos',4]]],['Torso (Hipertrofia)',[['Press banca plano',3],['Remo con barra',3],['Press inclinado mancuernas',3],['Jalón al pecho',3],['Elevaciones laterales',3],['Curl de bíceps',2],['Press francés',2]]],['Pierna (Hipertrofia)',[['Sentadilla',4],['Peso muerto rumano',3],['Prensa de piernas',3],['Hip thrust',3],['Elevación de gemelos',3]]],['Fullbody Alta Frecuencia',[['Sentadilla',3],['Press banca plano',3],['Remo con barra',3],['Press militar',2],['Peso muerto rumano',2],['Dominadas',2]]]];
function ensureEx(n,g,rg){let e=S.lib.find(x=>x.name==n);if(!e){const c=CAT[n]||[g||'',rg||'8-12'];e={id:uid(),name:n,group:c[0],range:c[1],img:'',notes:''};S.lib.push(e)}return e}
function addTpl(i){const t=TPL[i];S.routines.push({id:uid(),name:t[0],items:t[1].map(([n,s])=>(ensureEx(n),{name:n,sets:s}))});save();toast('Plantilla añadida');render()}
const rng=s=>{const m=String(s).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:[8,12]};
function lastSets(n){for(let i=S.history.length-1;i>=0;i--){const e=S.history[i].exs.find(x=>x.name==n);if(e&&e.sets.length)return e.sets}return null}
function tip(e,k){const L=lastSets(e.name);if(!L)return'Primera vez con este ejercicio: elige una carga que te deje 1-2 repeticiones en reserva (RIR 1-2).';const a=L[Math.min(k,L.length-1)],[lo,hi]=rng(e.range);return a.r>=hi?`Alcanzaste ${a.r} reps (techo del rango ${e.range}). Sobrecarga progresiva: sube a ${r1(a.w+2.5)} kg y vuelve a ~${lo} reps.`:`Mantén ${a.w} kg e intenta ${a.r+1} reps (+1 rep) antes de subir carga.`}
function initSet(){const e=W.exs[W.ei],k=e.done.length,[lo,hi]=rng(e.range);if(k){W.w=e.done[k-1].w;W.r=e.done[k-1].r;return}const L=lastSets(e.name);if(L){const a=L[0];W.w=a.r>=hi?r1(a.w+2.5):a.w;W.r=a.r>=hi?lo:a.r+1}else{W.w=0;W.r=lo}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
async function dl(name,blob){let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}if(d){try{await d.save({filename:name,data:blob})}catch(e){}return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function go(t){tab=t;render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
function render(){$('#app').innerHTML={hoy:vHoy,rut:vRut,pro:vPro,perf:vPerf}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));if(tab=='pro')drawChart()}
/* HOY */
function vHoy(){if(W)return vW();if(free)return vFree();
return`<h1>Hoy</h1><div class=card><label>Fecha del entrenamiento</label><input type=date value="${date}" onchange="date=this.value"></div>
<button class="btn p" onclick="free=[];render()">⚡ Entrenamiento libre / exprés</button><h2>Rutinas programadas</h2>`+(S.routines.map(r=>`<div class=card><h3>${esc(r.name)}</h3><div class=m>${r.items.map(i=>esc(i.name)+' ×'+i.sets).join(' · ')}</div><button class="btn e" onclick="startR('${r.id}')">Empezar</button></div>`).join('')||'<p class=m>Aún no tienes rutinas. Crea una o inserta una plantilla en la pestaña Rutinas.</p>')}
function vFree(){return`<h1>Entrenamiento libre</h1><p class=m>Elige 1 o 2 ejercicios de tu biblioteca.</p>`+(S.lib.map(e=>`<span class="chip ${free.includes(e.id)?'on':''}" onclick="tgF('${e.id}')">${esc(e.name)}</span>`).join('')||'<p class=m>Tu biblioteca está vacía. Añade ejercicios en Rutinas.</p>')+`<button class="btn e" onclick="startF()" ${free.length?'':'disabled'}>Iniciar</button><button class=btn onclick="free=null;render()">Volver</button>`}
function tgF(id){const i=free.indexOf(id);if(i>=0)free.splice(i,1);else if(free.length<2)free.push(id);render()}
function startF(){startW('Entrenamiento exprés',free.map(id=>({name:S.lib.find(e=>e.id==id).name,sets:3})));free=null}
function startR(id){const r=S.routines.find(x=>x.id==id);startW(r.name,r.items)}
function startW(name,items){W={name,date,ei:0,view:'focus',rest:90,exs:items.map(i=>{const e=ensureEx(i.name);return{name:e.name,group:e.group,range:e.range,img:e.img,sets:+i.sets||3,done:[]}})};initSet();render()}
function vW(){const e=W.exs[W.ei],k=e.done.length;
if(W.view=='sum'){let t=0,h='';W.exs.forEach(x=>{const tt=x.done.reduce((a,s)=>a+s.w*s.r,0);t+=tt;h+=`<div class=card><b>${esc(x.name)}</b><div class=m>${x.done.map(s=>s.w+'×'+s.r).join(' · ')||'—'}</div><div>Tonelaje: ${Math.round(tt)} kg</div></div>`});
return`<h1>🏁 Resumen</h1><div class=card><div class=m>Tonelaje total</div><div class=big>${Math.round(t).toLocaleString('es')} kg</div></div>${h}<button class="btn e" onclick="finW()">Guardar y terminar</button>`}
if(W.view=='done'){const l=e.done[e.done.length-1],last=W.ei==W.exs.length-1;return`<h1>✅ ${esc(e.name)}</h1><div class=card>${e.done.map((s,i)=>`<div class=row><span>Serie ${i+1}</span><b>${s.w} kg × ${s.r}</b><span class=m>1RM ${r1(e1(s.w,s.r))}</span></div>`).join('')}</div>
${last?'':'<button class="btn p" onclick="nextEx()">Siguiente ejercicio →</button>'}<button class="btn e" onclick="W.view=\'sum\';render()">Finalizar entrenamiento</button><button class=btn onclick="W.exs[W.ei].sets++;W.view=\'focus\';initSet();render()">+ Una serie extra</button>`}
const L=lastSets(e.name),ref=L&&L[Math.min(k,L.length-1)];
return`<div class=m>${esc(W.name)} · ejercicio ${W.ei+1}/${W.exs.length}</div><div class=card><div class=m>${esc(e.group)} · objetivo ${esc(e.range)} reps</div><h1 style="margin:4px 0">${esc(e.name)}</h1><div class="big" style="color:var(--em)">Serie ${k+1} de ${e.sets}</div>${e.img?`<img class=th src="${esc(e.img)}" onerror="this.remove()">`:''}</div>
<div class=card><div class=m>Última sesión</div><b>${ref?ref.w+' kg × '+ref.r+' reps':'Sin registro previo'}</b></div><div class=tip>🧠 ${tip(e,k)}</div>
<div class=card><label>Peso (kg)</label><div class=stp><button onclick="adj('w',-2.5)">−</button><input type=number step=0.5 inputmode=decimal value="${W.w}" oninput="W.w=+this.value"><button onclick="adj('w',2.5)">+</button></div>
<label>Repeticiones</label><div class=stp><button onclick="adj('r',-1)">−</button><input type=number inputmode=numeric value="${W.r}" oninput="W.r=+this.value"><button onclick="adj('r',1)">+</button></div>
<label>Descanso tras la serie</label>${[[30,'30s'],[60,'1m'],[90,'1.5m'],[120,'2m'],[180,'3m']].map(([s,t])=>`<span class="chip ${W.rest==s?'on':''}" onclick="W.rest=${s};render()">${t}</span>`).join('')}</div>
<button class="btn e" onclick="doneSet()">✔ Completar serie</button><button class="btn s" onclick="W=null;render()" style="margin-top:10px">Cancelar entrenamiento</button>`}
function adj(k,d){W[k]=Math.max(0,r1(W[k]+d));render()}
function doneSet(){const e=W.exs[W.ei];e.done.push({w:W.w,r:W.r});beep(520,.12);toast('1RM estimado (Epley): '+r1(e1(W.w,W.r))+' kg');
if(e.done.length>=e.sets){W.view='done';render()}else{initSet();render();startRest(W.rest)}}
function nextEx(){W.ei++;W.view='focus';initSet();render()}
function finW(){const exs=W.exs.filter(x=>x.done.length).map(x=>({name:x.name,group:x.group,sets:x.done}));if(exs.length){S.history.push({id:uid(),date:W.date,name:W.name,exs});S.history.sort((a,b)=>a.date<b.date?-1:1);save()}W=null;toast('Entrenamiento guardado');render()}
/* DESCANSO */
function beep(f,d){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function startRest(s){clearInterval(R&&R.iv);R={t:s,tot:s,p:0};R.iv=setInterval(()=>{if(R.p)return;R.t--;if(R.t<=0){beep(880,.6);endRest();return}if(R.t<=3)beep(660,.12);drawRest()},1000);drawRest()}
function drawRest(){const c=2*Math.PI*90,e=W&&W.exs[W.ei],m=Math.floor(R.t/60),s=R.t%60;const el=$('#rest');el.style.display='flex';
el.innerHTML=`<div class=m>Descanso · siguiente: serie ${e?e.done.length+1:''} de ${e?e.sets:''}</div><svg width=240 height=240 viewBox="0 0 200 200"><circle cx=100 cy=100 r=90 fill=none stroke="#1e293b" stroke-width=10 /><circle cx=100 cy=100 r=90 fill=none stroke="#10b981" stroke-width=10 stroke-linecap=round stroke-dasharray="${c}" stroke-dashoffset="${c*(1-R.t/R.tot)}" transform="rotate(-90 100 100)"/><text x=100 y=112 text-anchor=middle fill="#e2e8f0" font-size=42 font-weight=700>${m}:${String(s).padStart(2,'0')}</text></svg>
<div class=row style="max-width:360px;width:100%"><button class=btn onclick="rAdj(-15)">−15s</button><button class=btn onclick="R.p=!R.p;drawRest()">${R.p?'▶ Reانudar':'⏸ Pausar'}</button><button class=btn onclick="rAdj(15)">+15s</button></div><button class="btn p" style="max-width:360px" onclick="endRest()">Saltar descanso</button>`}
function rAdj(d){R.t=Math.max(1,R.t+d);R.tot=Math.max(R.tot,R.t);drawRest()}
function endRest(){clearInterval(R&&R.iv);R=null;$('#rest').style.display='none';render()}
/* RUTINAS */
function vRut(){return`<h1>Rutinas</h1><h2>Plantillas populares</h2><div>${TPL.map((t,i)=>`<span class=chip onclick="addTpl(${i})">+ ${t[0]}</span>`).join('')}</div>
<h2>Mis rutinas</h2>${S.routines.map(r=>`<div class=card><div class=row><div><b>${esc(r.name)}</b><div class=m>${r.items.map(i=>esc(i.name)+' ×'+i.sets).join(' · ')}</div></div><button class="btn d s" style="flex:none" onclick="S.routines=S.routines.filter(x=>x.id!='${r.id}');save();render()">Borrar</button></div></div>`).join('')||'<p class=m>Sin rutinas.</p>'}
<h2>Creador de rutina</h2><div class=card><label>Nombre</label><input id=rn placeholder="Ej. Torso A">${S.lib.map(e=>`<div class=row style="margin-top:6px"><label style="flex:3;margin:0;color:var(--tx)"><input type=checkbox style="width:auto" id="c${e.id}" ${sel[e.id]?'checked':''} onchange="sel['${e.id}']=this.checked"> ${esc(e.name)} <span class=m>${esc(e.group)}</span></label><input type=number min=1 value=3 id="s${e.id}" style="max-width:70px" title="Series"></div>`).join('')||'<p class=m>Añade ejercicios a tu biblioteca primero.</p>'}<button class="btn e" onclick="saveR()">Guardar rutina</button></div>
<h2>Mi biblioteca de ejercicios</h2><div class=card><label>Nombre</label><input id=en><div class=g2><div><label>Grupo muscular</label><input id=eg></div><div><label>Reps objetivo</label><input id=er value="8-12"></div></div><label>URL de imagen PNG/GIF (opcional)</label><input id=ei><label>Notas / tips de biomecánica</label><textarea id=eno rows=2></textarea><button class="btn p" onclick="addEx()">Añadir ejercicio</button></div>
${S.lib.map(e=>`<div class=card><div class=row><div><b>${esc(e.name)}</b> <span class=m>${esc(e.group)} · ${esc(e.range)}</span><div class=m>${esc(e.notes)}</div></div><button class="btn d s" style="flex:none" onclick="S.lib=S.lib.filter(x=>x.id!='${e.id}');save();render()">✕</button></div></div>`).join('')}`}
function addEx(){const n=$('#en').value.trim();if(!n)return toast('Pon un nombre');S.lib.push({id:uid(),name:n,group:$('#eg').value.trim(),range:$('#er').value.trim()||'8-12',img:$('#ei').value.trim(),notes:$('#eno').value.trim()});save();render()}
function saveR(){const n=$('#rn').value.trim(),it=S.lib.filter(e=>$('#c'+e.id)&&$('#c'+e.id).checked).map(e=>({name:e.name,sets:+$('#s'+e.id).value||3}));if(!n||!it.length)return toast('Nombre y al menos 1 ejercicio');S.routines.push({id:uid(),name:n,items:it});sel={};save();render()}
/* PROGRESO */
function prs(){const m={};S.history.forEach(h=>h.exs.forEach(e=>e.sets.forEach(s=>{const o=m[e.name]=m[e.name]||{w:0,e:0,g:e.group};o.w=Math.max(o.w,s.w);o.e=Math.max(o.e,e1(s.w,s.r))})));return m}
function vPro(){const m=prs(),names=Object.keys(m);if(!cex||!m[cex])cex=names[0]||'';
return`<h1>Progreso</h1><h2>🏆 Muro de récords</h2><div class=pr>${names.map(n=>`<div class=card style="margin:0"><div class=m>${esc(m[n].g)}</div><b>${esc(n)}</b><div style="color:var(--em);font-size:22px;font-weight:800">${r1(m[n].w)} kg</div><div class=m>1RM est. ${r1(m[n].e)} kg</div></div>`).join('')||'<p class=m>Completa entrenamientos para ver tus PRs.</p>'}</div>
<h2>Gráficas</h2><div class=card><div class=row><select onchange="cmode=this.value;render()"><option value=1rm ${cmode=='1rm'?'selected':''}>1RM estimado por ejercicio</option><option value=bw ${cmode=='bw'?'selected':''}>Evolución de peso corporal</option></select>${cmode=='1rm'?`<select onchange="cex=this.value;render()">${names.map(n=>`<option ${n==cex?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}</div><div style="height:280px;margin-top:10px"><canvas id=cv></canvas></div><button class="btn p" onclick="dlChart()">⬇ Descargar gráfica PNG</button></div>
<div class=card><h3>Registrar peso corporal</h3><div class=row><input type=date id=wd value="${today()}"><input type=number step=0.1 id=wk placeholder="kg"><button class="btn e s" style="flex:none" onclick="addW()">Añadir</button></div></div>
<h2>Historial reciente</h2>${S.history.slice(-10).reverse().map(h=>`<details class=card><summary><b>${esc(h.name)}</b> <span class=m>${h.date} · ${Math.round(h.exs.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0))} kg</span></summary>${h.exs.map(e=>`<div style="margin-top:6px"><b>${esc(e.name)}</b><div class=m>${e.sets.map(s=>s.w+'×'+s.r).join(' · ')}</div></div>`).join('')}</details>`).join('')||'<p class=m>Sin sesiones todavía.</p>'}`}
function addW(){const k=+$('#wk').value;if(!k)return;const d=$('#wd').value||today();S.weights=S.weights.filter(w=>w.date!=d);S.weights.push({date:d,kg:k});S.weights.sort((a,b)=>a.date<b.date?-1:1);save();render()}
function drawChart(){if(chart){chart.destroy();chart=null}if(typeof Chart=='undefined'||!$('#cv'))return;let lb=[],dt=[],lab;
if(cmode=='bw'){lb=S.weights.map(w=>w.date);dt=S.weights.map(w=>w.kg);lab='Peso corporal (kg)'}else{S.history.forEach(h=>{const e=h.exs.find(x=>x.name==cex);if(e){lb.push(h.date);dt.push(r1(Math.max(...e.sets.map(s=>e1(s.w,s.r)))))}});lab='1RM estimado (kg) · '+cex}
chart=new Chart($('#cv'),{type:'line',data:{labels:lb,datasets:[{label:lab,data:dt,borderColor:'#10b981',backgroundColor:'rgba(99,102,241,.25)',fill:true,tension:.3,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,devicePixelRatio:3,scales:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'}}},plugins:{legend:{labels:{color:'#e2e8f0'}}}},plugins:[{id:'bg',beforeDraw(c){const x=c.ctx;x.save();x.globalCompositeOperation='destination-over';x.fillStyle='#0f172a';x.fillRect(0,0,c.width,c.height);x.restore()}}]})}
function dlChart(){if(!chart)return toast('No hay gráfica');$('#cv').toBlob(b=>dl('grafica_'+cmode+'.png',b),'image/png')}
/* PERFIL */
function calc(){const p=S.profile,w=+p.weight,h=+p.height,a=+p.age;if(!w||!h||!a)return null;const bmr=p.sex=='f'?447.593+9.247*w+3.098*h-4.33*a:88.362+13.397*w+4.799*h-5.677*a,tdee=bmr*FACT[p.act||3],kc=tdee*(p.goal=='gain'?1.1:p.goal=='cut'?.8:1),pr=w*(p.goal=='cut'?2.4:p.goal=='gain'?2:2.2),fa=w*(p.goal=='cut'?.8:.9),ch=Math.max(0,(kc-pr*4-fa*9)/4),bmi=w/Math.pow(h/100,2);return{bmr,tdee,kc,pr,fa,ch,bmi}}
function vPerf(){const p=S.profile,c=calc();const v=k=>esc(p[k]??'');
return`<h1>Perfil</h1><div class=card><label>Nombre</label><input id=pn value="${v('name')}"><div class=g2><div><label>Edad</label><input id=pa type=number value="${v('age')}"></div><div><label>Sexo</label><select id=ps><option value=m ${p.sex!='f'?'selected':''}>Hombre</option><option value=f ${p.sex=='f'?'selected':''}>Mujer</option></select></div><div><label>Altura (cm)</label><input id=ph type=number value="${v('height')}"></div><div><label>Peso (kg)</label><input id=pw type=number step=0.1 value="${v('weight')}"></div></div>
<label>Nivel de actividad</label><select id=pc>${[1,2,3,4,5].map(i=>`<option value=${i} ${(p.act||3)==i?'selected':''}>${ACTS[i]}</option>`).join('')}</select><label>Objetivo</label><select id=pg>${Object.entries(GOALS).map(([k,t])=>`<option value=${k} ${p.goal==k?'selected':''}>${t}</option>`).join('')}</select><button class="btn e" onclick="saveP()">Guardar y analizar</button></div>
${c?`<h2>🔬 Análisis científico</h2><div class=g2><div class=card><div class=m>BMR (Harris-Benedict)</div><b>${Math.round(c.bmr)} kcal</b></div><div class=card><div class=m>TDEE</div><b>${Math.round(c.tdee)} kcal</b></div><div class=card><div class=m>Calorías objetivo</div><b style="color:var(--em)">${Math.round(c.kc)} kcal</b></div><div class=card><div class=m>IMC</div><b>${r1(c.bmi)}</b> <span class=m>${c.bmi<18.5?'bajo peso':c.bmi<25?'normal':c.bmi<30?'sobrepeso':'obesidad'}</span></div></div>
<div class=card><h3>Macronutrientes diarios</h3><div class=g2><div>🥩 Proteína<br><b>${Math.round(c.pr)} g</b></div><div>🥑 Grasas<br><b>${Math.round(c.fa)} g</b></div><div>🍚 Carbohidratos<br><b>${Math.round(c.ch)} g</b></div><div class=m>Proteína ${r1(c.pr/p.weight)} g/kg</div></div></div>
<div class=card><h3>🎯 Tu plan de entrenamiento</h3><ul class=m style="padding-left:18px;margin:0"><li>Volumen efectivo: 12-20 series semanales por grupo muscular${p.goal=='cut'?' (en déficit, mantén el volumen y prioriza la intensidad)':''}.</li><li>Cerca del fallo: RIR 1-2 en la mayoría de series.</li><li>Sobrecarga progresiva desde la semana 2: primero reps hasta el techo del rango, luego +2.5 kg.</li><li>Descansos de 2-3 min en compuestos, 60-90 s en aislamiento.</li><li>${p.goal=='gain'?'Superávit moderado (~10%) para minimizar grasa ganada.':p.goal=='cut'?'Déficit del 20% y proteína alta para preservar músculo.':'Calorías de mantenimiento y entrenamiento constante.'} Duerme 7-9 h.</li></ul></div>`:'<p class=m>Completa edad, altura y peso para ver tu análisis.</p>'}
<h2>💾 Respaldo Excel</h2><div class=card><button class="btn p" onclick="exportX()">⬇ Exportar Excel</button><label>Importar respaldo (.xlsx)</label><input type=file accept=".xlsx,.xls" onchange="importX(this.files[0])"></div>`}
function saveP(){const p=S.profile;Object.assign(p,{name:$('#pn').value,age:$('#pa').value,sex:$('#ps').value,height:$('#ph').value,weight:$('#pw').value,act:+$('#pc').value,goal:$('#pg').value});if(+p.weight){S.weights=S.weights.filter(w=>w.date!=today());S.weights.push({date:today(),kg:+p.weight});S.weights.sort((a,b)=>a.date<b.date?-1:1)}save();toast('Perfil guardado');render()}
/* EXCEL */
function exportX(){if(typeof XLSX=='undefined')return toast('Librería Excel no disponible');const wb=XLSX.utils.book_new(),p=S.profile,A=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),n);
A('Perfil',[{Nombre:p.name||'',Edad:p.age||'',Sexo:p.sex=='f'?'Mujer':'Hombre',Altura_cm:p.height||'',Peso_kg:p.weight||'',Actividad:ACTS[p.act||3],Objetivo:GOALS[p.goal||'gain']}]);
A('Biblioteca_Ejercicios',S.lib.map(e=>({Nombre:e.name,Grupo:e.group,Rango_Reps:e.range,Imagen:e.img,Notas:e.notes})));
const hr=[];S.history.forEach(h=>h.exs.forEach(e=>e.sets.forEach((s,i)=>hr.push({Fecha:h.date,Rutina:h.name,Ejercicio:e.name,Grupo:e.group,Serie:i+1,Peso_kg:s.w,Reps:s.r,'1RM_Estimado':r1(e1(s.w,s.r))}))));A('Historial_Gimnasio',hr);
A('Peso_Corporal',S.weights.map(w=>({Fecha:w.date,Peso_kg:w.kg})));
A('Rutinas',S.routines.flatMap(r=>r.items.map(i=>({Nombre:r.name,Ejercicio:i.name,Series:i.sets}))));
const o=XLSX.write(wb,{bookType:'xlsx',type:'array'});dl('coachfit_respaldo_'+today()+'.xlsx',new Blob([o],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
const nk=k=>String(k).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const gv=(r,al)=>{for(const k in r)if(al.includes(nk(k)))return r[k];return''};
const dt=v=>typeof v=='number'&&v>20000?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10):String(v||'').slice(0,10);
function importX(f){if(!f)return;const fr=new FileReader();fr.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});
const sh=ks=>{const n=wb.SheetNames.find(s=>ks.some(k=>nk(s).includes(k)));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}):[]};
const N=S2=>S2;const T={profile:{},lib:[],routines:[],history:[],weights:[]};
const pr=sh(['perfil','profile'])[0];if(pr){const a=nk(gv(pr,['actividad','activity','nivel'])),g=nk(gv(pr,['objetivo','goal']));T.profile={name:gv(pr,['nombre','name']),age:gv(pr,['edad','age']),height:gv(pr,['alturacm','altura','height','heightcm']),weight:gv(pr,['pesokg','peso','weight','weightkg']),sex:/^(f|m(ujer|ale)?$)/.test(nk(gv(pr,['sexo','sex','genero'])))&&/^f|mujer/.test(nk(gv(pr,['sexo','sex','genero'])))?'f':'m',act:/muy|very/.test(a)?5:/sedent/.test(a)?1:/lig|light/.test(a)?2:/moder/.test(a)?3:/activ|high|alta/.test(a)?4:(+a>=1&&+a<=5?+a:3),goal:/hiper|gan|gain|bulk|musc/.test(g)?'gain':/perd|def|cut|fat|loss|grasa/.test(g)?'cut':'keep'}}
sh(['biblio','librar','exercise','ejercicios']).filter(r=>!/historial/.test('')).forEach(r=>{const n=String(gv(r,['nombre','name','ejercicio','exercise'])).trim();if(n&&!T.lib.find(x=>x.name==n))T.lib.push({id:uid(),name:n,group:gv(r,['grupo','grupomuscular','group','muscle']),range:String(gv(r,['rangoreps','rango','reps','range'])||'8-12'),img:gv(r,['imagen','img','image','url']),notes:gv(r,['notas','notes','tips'])})});
const ens=(n,g)=>{if(n&&!T.lib.find(x=>x.name==n))T.lib.push({id:uid(),name:n,group:g||(CAT[n]||[''])[0],range:(CAT[n]||['','8-12'])[1],img:'',notes:''})};
const hm={};sh(['historial','history','gimnasio','gym']).forEach(r=>{const d=dt(gv(r,['fecha','date'])),rn=gv(r,['rutina','routine','nombre','name'])||'Entrenamiento',en=String(gv(r,['ejercicio','exercise'])).trim(),w=+gv(r,['pesokg','peso','weight','kg']),rp=+gv(r,['reps','repeticiones','repetitions']);if(!d||!en||!rp)return;const k=d+'|'+rn,h=hm[k]=hm[k]||{id:uid(),date:d,name:rn,exs:[]};let x=h.exs.find(y=>y.name==en);if(!x){x={name:en,group:gv(r,['grupo','group']),sets:[]};h.exs.push(x);ens(en,x.group)}x.sets.push({w,r:rp})});
T.history=Object.values(hm).sort((a,b)=>a.date<b.date?-1:1);
const rm={};sh(['rutinas','routines']).forEach(r=>{const n=gv(r,['nombre','name','rutina','routine']),en=String(gv(r,['ejercicio','exercise'])).trim();if(!n||!en)return;rm[n]=rm[n]||{id:uid(),name:n,items:[]};rm[n].items.push({name:en,sets:+gv(r,['series','sets'])||3});ens(en)});T.routines=Object.values(rm);
T.weights=sh(['peso','weight','corporal','body']).map(r=>({date:dt(gv(r,['fecha','date'])),kg:+gv(r,['pesokg','peso','weight','kg'])})).filter(w=>w.date&&w.kg);
S=Object.assign(S,T);save();toast('Respaldo restaurado ✔');render()}catch(err){toast('No se pudo leer el archivo')}};fr.readAsArrayBuffer(f)}
render();
</script></body></html>
